<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="194" viewBox="0 0 1120 194" role="img" aria-label="Sweeping radar and a blinking ASCII owl at a terminal. Silent intrusion is the deadliest art. Hunt threats before they hunt you." class="rp-signal"><title>Field notes / Threat radar</title><style>
